name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Show environment
        run: python -c "import torch, numpy, pandas, matplotlib; print('torch', torch.__version__)"

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: "1"
          # 无头环境下 matplotlib 使用 Agg 后端
          MPLBACKEND: Agg
        run: pytest tests -v

      - name: Regenerate comparison figures (smoke test)
        env:
          MPLBACKEND: Agg
        run: python scripts/plot_evolution.py --outdir /tmp/figures

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: figures-py${{ matrix.python-version }}
          path: /tmp/figures/*.png
          if-no-files-found: error
