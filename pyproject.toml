[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rl-industrial-control"
version = "1.0.0"
description = "Offline RL (CQL / GRU / TCN) for an industrial control benchmark"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 被测 agent 会 chdir 到自身目录并 print 中文/emoji，测试内已用 conftest 处理
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = []
